<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Ejercicios de Ruso</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
        }
        h1, h2, h3 { margin-top: 2rem; }
        .exercise-box {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1rem 0;
            background: #fafafa;
        }
        .prompt {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        .options {
            list-style: none;
            padding: 0;
        }
        .options li {
            margin: 0.5rem 0;
        }
        .options button {
            width: 100%;
            text-align: left;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 1rem;
        }
        .options button:hover { background: #f0f0f0; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; }
        .incorrect { background: #f8d7da !important; border-color: #dc3545 !important; }
        .feedback {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #d4edda; color: #155724; }
        .feedback.incorrect { background: #f8d7da; color: #721c24; }
        .controls {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }
        button:disabled { background: #6c757d; cursor: not-allowed; }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 4px;
            vertical-align: middle;
        }
        .score {
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .speech-result {
            margin-top: 0.5rem;
            font-style: italic;
        }
        #transcript { font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>

            // Ropa
            { ru: "Одежда", en: "Ropa", audio: "tts_ru_Одежда.mp3" },
            { ru: "Рубашка", en: "Camisa", audio: "tts_ru_Рубашка.mp3" },

            // Transporte
            { ru: "Машина", en: "Coche", audio: "tts_ru_Машина.mp3" },
            { ru: "Автобус", en: "Autobús", audio: "tts_ru_Автобус.mp3" },

            { ru: "Аэропорт", en: "Aeropuerto", audio: "tts_ru_Аэропорт.mp3" },
            { ru: "Вокзал", en: "Estación de tren", audio: "tts_ru_Вокзал.mp3" },
            { ru: "Билет", en: "Billete", audio: "tts_ru_Билет.mp3" },
            { ru: "Отель", en: "Hotel", audio: "tts_ru_Отель.mp3" },

            // Emergencias
            { ru: "Помощь", en: "Ayuda", audio: "tts_ru_Помощь.mp3" },
            { ru: "Пожар", en: "Fuego", audio: "tts_ru_Пожар.mp3" },
            { ru: "Полиция", en: "Policía", audio: "tts_ru_Полиция.mp3" },
            { ru: "Скорая помощь", en: "Ambulancia", audio: "tts_ru_Скорая помощь.mp3" },
            { ru: "Врач", en: "Médico", audio: "tts_ru_Врач.mp3" },
            { ru: "Опасность", en: "Peligro", audio: "tts_ru_Опасность.mp3" },
            { ru: "Тревога", en: "Alarma", audio: "tts_ru_Тревога.mp3" },
            { ru: "Спасите", en: "¡Socorro!", audio: "tts_ru_Спасите.mp3" },
            { ru: "Полицейский", en: "Agente de policía", audio: "tts_ru_Полицейский.mp3" },

            // Frases útiles
            { ru: "Как сказать по-русски", en: "¿Cómo se dice en ruso...?", audio: "tts_ru_Как сказать по-русски.mp3" },
            { ru: "Я не понимаю", en: "No entiendo", audio: "tts_ru_Я не понимаю.mp3" },
            { ru: "Повторите пожалуйста", en: "Repita, por favor", audio: "tts_ru_Повторите пожалуйста.mp3" },
            { ru: "Говорите медленнее", en: "Hable más despacio", audio: "tts_ru_Говорите медленнее.mp3" },
            { ru: "Что это значит", en: "¿Qué significa esto?", audio: "tts_ru_Что это значит.mp3" },
            { ru: "Я не знаю", en: "No sé", audio: "tts_ru_Я не знаю.mp3" },
            { ru: "Напишите это", en: "Escríbalo", audio: "tts_ru_Напишите это.mp3" },
            { ru: "Помогите мне пожалуйста", en: "Ayúdeme, por favor", audio: "tts_ru_Помогите мне пожалуйста.mp3" },
            { ru: "Где туалет", en: "¿Dónde está el baño?", audio: "tts_ru_Где туалет.mp3" }
        ];

        // ================== GESTIÓN DE EJERCICIOS ==================
        let currentExercise = null;
        let score = 0;
        let totalAnswered = 0;
        let exerciseQueue = [];
        let userAnswer = null;

        // Elementos DOM
        const container = document.getElementById('exercise-container');
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const playAudioBtn = document.getElementById('play-audio-btn');
        const recordBtn = document.getElementById('record-btn');
        const feedbackDiv = document.getElementById('feedback');
        const scoreDisplay = document.getElementById('score-display');

        // Tipos de ejercicio
        const EXERCISE_TYPES = ['select', 'write', 'fillblank', 'reading', 'speaking'];

        // Generar un ejercicio aleatorio
        function generateExercise() {
            const type = EXERCISE_TYPES[Math.floor(Math.random() * EXERCISE_TYPES.length)];
            const item = vocabulary[Math.floor(Math.random() * vocabulary.length)];

            switch(type) {
                case 'select':
                    return createSelectExercise(item);
                case 'write':
                    return createWriteExercise(item);
                case 'fillblank':
                    return createFillBlankExercise(item);
                case 'reading':
                    return createReadingExercise(item);
                case 'speaking':
                    return createSpeakingExercise(item);
                default:
                    return null;
            }
        }

        function createSelectExercise(item) {
            // Opciones: 3 traducciones incorrectas + la correcta
            let options = [item.en];
            while (options.length < 4) {
                const randomItem = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(randomItem.en)) {
                    options.push(randomItem.en);
                }
            }
            options = shuffle(options);

            return {
                type: 'select',
                prompt: `¿Qué significa <strong>${item.ru}</strong>?`,
                audio: item.audio,
                correct: item.en,
                options: options,
                check: function(selected) {
                    return selected === this.correct;
                }
            };
        }

        function createWriteExercise(item) {
            return {
                type: 'write',
                prompt: `Escribe en ruso: <strong>${item.en}</strong>`,
                audio: item.audio,
                correct: item.ru,
                check: function(answer) {
                    return answer.trim().toLowerCase() === this.correct.toLowerCase();
                }
            };
        }

        function createFillBlankExercise(item) {
            // Frase sencilla con el hueco: "Я ___" para pronombres, etc.
            // Por simplicidad, mostraremos solo la palabra en inglés y pedimos la rusa.
            // También podemos crear frases contextuales pero eso requeriría más datos.
            return {
                type: 'fillblank',
                prompt: `Completa: <strong>${item.en}</strong> → ____ (en ruso)`,
                audio: item.audio,
                correct: item.ru,
                check: function(answer) {
                    return answer.trim().toLowerCase() === this.correct.toLowerCase();
                }
            };
        }

        function createReadingExercise(item) {
            return {
                type: 'reading',
                prompt: `Lee en voz alta: <strong>${item.ru}</strong>`,
                audio: item.audio,
                correct: item.ru,
                check: function() {
                    // No hay comprobación automática, solo autoevaluación
                    return true;
                }
            };
        }

        function createSpeakingExercise(item) {
            return {
                type: 'speaking',
                prompt: `Pronuncia en ruso: <strong>${item.ru}</strong> (traducción: ${item.en})`,
                audio: item.audio,
                correct: item.ru,
                check: function(transcript) {
                    if (!transcript) return false;
                    return transcript.trim().toLowerCase() === this.correct.toLowerCase();
                }
            };
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderExercise(ex) {
            currentExercise = ex;
            userAnswer = null;
            feedbackDiv.classList.remove('show', 'correct', 'incorrect');
            checkBtn.disabled = false;
            recordBtn.disabled = true; // por defecto, se habilita solo si es speaking

            let html = `<div class="prompt">${ex.prompt}</div>`;

            if (ex.type === 'select') {
                html += `<ul class="options">`;
                ex.options.forEach(opt => {
                    html += `<li><button class="option-btn" data-value="${opt}">${opt}</button></li>`;
                });
                html += `</ul>`;
            } else if (ex.type === 'write' || ex.type === 'fillblank') {
                html += `<input type="text" id="text-answer" placeholder="Escribe aquí..." style="width:100%; padding:0.5rem; font-size:1rem;">`;
            } else if (ex.type === 'reading' || ex.type === 'speaking') {
                html += `<p>Escucha el audio y repite.</p>`;
                if (ex.type === 'speaking') {
                    recordBtn.disabled = false;
                }
            }

            container.innerHTML = html;

            // Eventos para opciones de selección
            if (ex.type === 'select') {
                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        // Quitar selección anterior
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        userAnswer = btn.dataset.value;
                    });
                });
            }

            // Evento para entrada de texto
            if (ex.type === 'write' || ex.type === 'fillblank') {
                const input = document.getElementById('text-answer');
                input.addEventListener('input', () => {
                    userAnswer = input.value;
                });
            }

            // Botón de audio
            playAudioBtn.onclick = () => {
                if (ex.audio) {
                    const audio = new Audio('audio/' + ex.audio);
                    audio.play();
                }
            };
        }

        function checkAnswer() {
            if (!currentExercise) return;
            let isCorrect = false;
            let message = '';

            if (currentExercise.type === 'select') {
                if (userAnswer === null) {
                    alert('Selecciona una opción');
                    return;
                }
                isCorrect = currentExercise.check(userAnswer);
                // Marcar visualmente
                document.querySelectorAll('.option-btn').forEach(btn => {
                    if (btn.dataset.value === currentExercise.correct) {
                        btn.classList.add('correct');
                    } else if (btn.dataset.value === userAnswer) {
                        btn.classList.add('incorrect');
                    }
                });
            } else if (currentExercise.type === 'write' || currentExercise.type === 'fillblank') {
                if (!userAnswer || userAnswer.trim() === '') {
                    alert('Escribe una respuesta');
                    return;
                }
                isCorrect = currentExercise.check(userAnswer);
            } else if (currentExercise.type === 'reading' || currentExercise.type === 'speaking') {
                // Para speaking, si hay transcripción, comprobamos; si no, asumimos correcto (autoevaluación)
                if (currentExercise.type === 'speaking' && currentExercise.transcript) {
                    isCorrect = currentExercise.check(currentExercise.transcript);
                } else {
                    isCorrect = true; // autoevaluación
                }
            }

            if (isCorrect) {
                score++;
                message = '¡Correcto!';
                feedbackDiv.className = 'feedback correct show';
            } else {
                message = `Incorrecto. La respuesta correcta es: <strong>${currentExercise.correct}</strong>`;
                feedbackDiv.className = 'feedback incorrect show';
            }

            totalAnswered++;
            scoreDisplay.textContent = `Puntuación: ${score} / ${totalAnswered}`;
            feedbackDiv.innerHTML = message;
            checkBtn.disabled = true;
        }

        function nextExercise() {
            const ex = generateExercise();
            renderExercise(ex);
        }

        // Inicialización
        nextBtn.addEventListener('click', nextExercise);
        checkBtn.addEventListener('click', checkAnswer);

        // Speech Recognition (si está disponible)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                currentExercise.transcript = transcript;
                document.getElementById('transcript')?.remove();
                const p = document.createElement('p');
                p.id = 'transcript';
                p.innerHTML = `Has dicho: <strong>${transcript}</strong>`;
                container.appendChild(p);
                // Habilitar comprobación automática
                checkBtn.disabled = false;
            };

            recognition.onerror = (event) => {
                alert('Error en reconocimiento de voz: ' + event.error);
            };

            recordBtn.addEventListener('click', () => {
                recognition.start();
                recordBtn.disabled = true;
            });

            recognition.onend = () => {
                recordBtn.disabled = false;
            };
        } else {
            recordBtn.style.display = 'none';
        }

        // Cargar primer ejercicio
        nextExercise();
    </script>
</body>
