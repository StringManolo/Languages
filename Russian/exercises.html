// The rest of the script follows (same as previous, but compacted)
let currentExercise=null,score=0,totalAnswered=0,userAnswer=null,currentTopic='all',seenIndices=new Set();
const STORAGE_KEY='russianExercisesSeen';
const container=document.getElementById('exercise-container'),checkBtn=document.getElementById('check-btn'),nextBtn=document.getElementById('next-btn'),playAudioBtn=document.getElementById('play-audio-btn'),recordBtn=document.getElementById('record-btn'),feedbackDiv=document.getElementById('feedback'),scoreDisplay=document.getElementById('score-display'),topicSelect=document.getElementById('topic-select'),ratingDiv=document.getElementById('rating');
function loadSeen(){let s=localStorage.getItem(STORAGE_KEY);if(s){try{seenIndices=new Set(JSON.parse(s))}catch(e){seenIndices=new Set()}}}
function saveSeen(){localStorage.setItem(STORAGE_KEY,JSON.stringify([...seenIndices]))}
function getFilteredVocabulary(){return currentTopic==='all'?vocabulary:vocabulary.filter(i=>i.topic===currentTopic)}
function pickUnseenItem(){let f=getFilteredVocabulary();if(!f.length)return null;let unseen=f.filter(i=>!seenIndices.has(vocabulary.indexOf(i)));if(!unseen.length){f.forEach(i=>seenIndices.delete(vocabulary.indexOf(i)));saveSeen();unseen=[...f]}let item=unseen[Math.floor(Math.random()*unseen.length)];seenIndices.add(vocabulary.indexOf(item));saveSeen();return item}
function generateExercise(){let item=pickUnseenItem();if(!item)return null;let types=['select','write','fillblank','reading','speaking'];let type=types[Math.floor(Math.random()*types.length)];switch(type){case'select':return createSelectExercise(item);case'write':return createWriteExercise(item);case'fillblank':return createFillBlankExercise(item);case'reading':return createReadingExercise(item);case'speaking':return createSpeakingExercise(item)}}
function createSelectExercise(item){let opts=[item.en];while(opts.length<4){let r=vocabulary[Math.floor(Math.random()*vocabulary.length)];if(!opts.includes(r.en))opts.push(r.en)}opts=shuffle(opts);return{type:'select',prompt:`What does "<strong>${item.ru}</strong>" mean?`,audio:item.audio,correct:item.en,options:opts,check:s=>s===item.en}}
function createWriteExercise(item){return{type:'write',prompt:`Type in Russian: <strong>${item.en}</strong>`,audio:item.audio,correct:item.ru,check:a=>a.trim().toLowerCase()===item.ru.toLowerCase()}}
function createFillBlankExercise(item){return{type:'fillblank',prompt:`Fill in the blank: <strong>${item.en}</strong> → ____ (in Russian)`,audio:item.audio,correct:item.ru,check:a=>a.trim().toLowerCase()===item.ru.toLowerCase()}}
function createReadingExercise(item){return{type:'reading',prompt:`Read aloud: <strong>${item.ru}</strong>`,audio:item.audio,correct:item.ru,check:()=>true}}
function createSpeakingExercise(item){return{type:'speaking',prompt:`Say in Russian: <strong>${item.ru}</strong> (${item.en})`,audio:item.audio,correct:item.ru}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderExercise(ex){if(!ex){container.innerHTML='<p>No exercises available. Please choose a topic.</p>';checkBtn.disabled=true;recordBtn.disabled=true;ratingDiv.innerHTML='';return}currentExercise=ex;userAnswer=null;feedbackDiv.classList.remove('show','correct','incorrect');feedbackDiv.innerHTML='';ratingDiv.innerHTML='';checkBtn.disabled=false;recordBtn.disabled=true;let html=`<div class="prompt">${ex.prompt}</div>`;if(ex.type==='select'){html+='<ul class="options">';ex.options.forEach(o=>html+=`<li><button class="option-btn" data-value="${o}">${o}</button></li>`);html+='</ul>'}else if(ex.type==='write'||ex.type==='fillblank'){html+='<input type="text" id="text-answer" placeholder="Type here..." style="width:100%;padding:.5rem;font-size:1rem;">'}else if(ex.type==='reading'||ex.type==='speaking'){html+='<p>Listen to the audio and then speak.</p>';if(ex.type==='speaking')recordBtn.disabled=false}container.innerHTML=html;if(ex.type==='select'){document.querySelectorAll('.option-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.option-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');userAnswer=b.dataset.value}))}if(ex.type==='write'||ex.type==='fillblank'){let input=document.getElementById('text-answer');input.addEventListener('input',()=>userAnswer=input.value)}playAudioBtn.onclick=()=>{if(ex.audio)new Audio('audio/'+ex.audio).play()}}
function checkAnswer(){if(!currentExercise)return;let isCorrect=false,msg='';if(currentExercise.type==='select'){if(userAnswer===null){alert('Please select an option');return}isCorrect=currentExercise.check(userAnswer);document.querySelectorAll('.option-btn').forEach(b=>{if(b.dataset.value===currentExercise.correct)b.classList.add('correct');else if(b.dataset.value===userAnswer)b.classList.add('incorrect')})}else if(currentExercise.type==='write'||currentExercise.type==='fillblank'){if(!userAnswer||!userAnswer.trim()){alert('Please type an answer');return}isCorrect=currentExercise.check(userAnswer)}else if(currentExercise.type==='reading'){isCorrect=true;msg='Self-evaluation: read aloud and compare with the audio.'}else if(currentExercise.type==='speaking')return;if(isCorrect){score++;msg='Correct!';feedbackDiv.className='feedback correct show'}else{msg=`Incorrect. The correct answer is: <strong>${currentExercise.correct}</strong>`;feedbackDiv.className='feedback incorrect show'}totalAnswered++;scoreDisplay.textContent=`Score: ${score} / ${totalAnswered}`;feedbackDiv.innerHTML=msg;checkBtn.disabled=true}
function levenshtein(a,b){let m=Array.from({length:a.length+1},()=>[]);for(let i=0;i<=a.length;i++)m[i][0]=i;for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function similarityPercentage(a,b){a=a.trim().toLowerCase();b=b.trim().toLowerCase();if(!a.length||!b.length)return 0;let d=levenshtein(a,b),max=Math.max(a.length,b.length);return Math.max(0,Math.round((1-d/max)*100))}
function getRating(p){if(p>=95)return'Perfect! 🎯';if(p>=85)return'Very good! 👏';if(p>=70)return'Good! 👍';if(p>=50)return'Okay. 🙂';if(p>=30)return'Bad. 😕';return'Terrible. 😖'}
function handleSpeakingResult(transcript){if(!currentExercise||currentExercise.type!=='speaking')return;let pct=similarityPercentage(transcript,currentExercise.correct);let rating=getRating(pct);feedbackDiv.className='feedback show';feedbackDiv.innerHTML=`You said: <strong>${transcript}</strong><br>Similarity: <strong>${pct}%</strong><br>Rating: <strong>${rating}</strong>`;ratingDiv.innerHTML=`<span style="font-size:2rem;">${rating}</span>`;if(pct>=70)score++;totalAnswered++;scoreDisplay.textContent=`Score: ${score} / ${totalAnswered}`;checkBtn.disabled=true}
if('webkitSpeechRecognition'in window||'SpeechRecognition'in window){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=new SR();recognition.lang='ru-RU';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=e=>{let transcript=e.results[0][0].transcript;currentExercise.transcript=transcript;let old=document.getElementById('transcript');if(old)old.remove();let p=document.createElement('p');p.id='transcript';p.innerHTML=`You said: <strong>${transcript}</strong>`;container.appendChild(p);if(currentExercise.type==='speaking')handleSpeakingResult(transcript);else checkBtn.disabled=false};recognition.onerror=e=>alert('Speech recognition error: '+e.error);recordBtn.addEventListener('click',()=>{recognition.start();recordBtn.disabled=true});recognition.onend=()=>recordBtn.disabled=false}else recordBtn.style.display='none';
topicSelect.addEventListener('change',()=>{currentTopic=topicSelect.value;nextExercise()});
loadSeen();currentTopic='all';topicSelect.value='all';nextExercise();
nextBtn.addEventListener('click',nextExercise);checkBtn.addEventListener('click',checkAnswer);
</script>
