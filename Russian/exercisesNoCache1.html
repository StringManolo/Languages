        h1,h2,h3{margin-top:2rem}
        .exercise-box{border:1px solid #ccc;border-radius:8px;padding:1.5rem;margin:1rem 0;background:#fafafa}
        .prompt{font-size:1.2rem;margin-bottom:1rem}
        .options{list-style:none;padding:0}
        .options li{margin:.5rem 0}
        .options button{width:100%;text-align:left;padding:.75rem;border:1px solid #ddd;border-radius:4px;background:white;cursor:pointer;font-size:1rem;color:#333}
        .options button:hover{background:#f0f0f0}
        .correct{background:#d4edda!important;border-color:#28a745!important}
        .incorrect{background:#f8d7da!important;border-color:#dc3545!important}
        .selected{background:#e2e6ea}
        .feedback{margin-top:1rem;padding:.5rem 1rem;border-radius:4px;display:none}
        .feedback.show{display:block}
        .feedback.correct{background:#d4edda;color:#155724}
        .feedback.incorrect{background:#f8d7da;color:#721c24}
        .controls{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap;align-items:center}
        button{padding:.5rem 1rem;border:none;border-radius:4px;background:#007bff;color:white;cursor:pointer;font-size:1rem}
        button:disabled{background:#6c757d;cursor:not-allowed}
        .icon-btn{background:none;border:none;cursor:pointer;font-size:1.2rem;padding:0 4px;vertical-align:middle}
        .score{font-weight:bold;margin-bottom:1rem}
        #transcript{font-weight:bold}
        #topic-select{padding:.5rem;font-size:1rem;margin-right:.5rem}
        #rating{font-size:1.2rem;font-weight:bold;margin-top:.5rem}
    </style>
</head>

        // ================== APP STATE ==================
        let currentExercise = null;
        let score = 0;
        let totalAnswered = 0;
        let userAnswer = null;
        let currentTopic = 'all';
        let seenIndices = new Set();

        const STORAGE_KEY = 'russianExercisesSeen';

        const container = document.getElementById('exercise-container');
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const playAudioBtn = document.getElementById('play-audio-btn');
        const recordBtn = document.getElementById('record-btn');
        const feedbackDiv = document.getElementById('feedback');
        const scoreDisplay = document.getElementById('score-display');
        const topicSelect = document.getElementById('topic-select');
        const ratingDiv = document.getElementById('rating');

        // Load seen indices from localStorage
        function loadSeen() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    seenIndices = new Set(JSON.parse(stored));
                } catch (e) {
                    seenIndices = new Set();
                }
            }
        }

        function saveSeen() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify([...seenIndices]));
        }

        function getFilteredVocabulary() {
            if (currentTopic === 'all') {
                return vocabulary;
            } else {
                return vocabulary.filter(item => item.topic === currentTopic);
            }
        }

        function pickUnseenItem() {
            const filtered = getFilteredVocabulary();
            if (filtered.length === 0) return null;

            let unseen = filtered.filter(item => {
                const originalIndex = vocabulary.indexOf(item);
                return !seenIndices.has(originalIndex);
            });

            if (unseen.length === 0) {
                filtered.forEach(item => {
                    const originalIndex = vocabulary.indexOf(item);
                    seenIndices.delete(originalIndex);
                });
                saveSeen();
                unseen = [...filtered];
            }

            const randomItem = unseen[Math.floor(Math.random() * unseen.length)];
            const originalIndex = vocabulary.indexOf(randomItem);
            seenIndices.add(originalIndex);
            saveSeen();
            return randomItem;
        }

        function generateExercise() {
            const item = pickUnseenItem();
            if (!item) return null;

            const types = ['select', 'write', 'fillblank', 'reading', 'speaking'];
            const type = types[Math.floor(Math.random() * types.length)];

            switch (type) {
                case 'select': return createSelectExercise(item);
                case 'write': return createWriteExercise(item);
                case 'fillblank': return createFillBlankExercise(item);
                case 'reading': return createReadingExercise(item);
                case 'speaking': return createSpeakingExercise(item);
                default: return null;
            }
        }

        function createSelectExercise(item) {
            let options = [item.en];
            while (options.length < 4) {
                const randomItem = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(randomItem.en)) {
                    options.push(randomItem.en);
                }
            }
            options = shuffle(options);
            return {
                type: 'select',
                prompt: `What does "<strong>${item.ru}</strong>" mean?`,
                audio: item.audio,
                correct: item.en,
                options: options,
                check: function(selected) { return selected === this.correct; }
            };
        }

        function createWriteExercise(item) {
            return {
                type: 'write',
                prompt: `Type in Russian: <strong>${item.en}</strong>`,
                audio: item.audio,
                correct: item.ru,
                check: function(answer) { return answer.trim().toLowerCase() === this.correct.toLowerCase(); }
            };
        }

        function createFillBlankExercise(item) {
            return {
                type: 'fillblank',
                prompt: `Fill in the blank: <strong>${item.en}</strong> → ____ (in Russian)`,
                audio: item.audio,
                correct: item.ru,
                check: function(answer) { return answer.trim().toLowerCase() === this.correct.toLowerCase(); }
            };
        }

        function createReadingExercise(item) {
            return {
                type: 'reading',
                prompt: `Read aloud: <strong>${item.ru}</strong>`,
                audio: item.audio,
                correct: item.ru,
                check: function() { return true; } // self-evaluation
            };
        }

        function createSpeakingExercise(item) {
            return {
                type: 'speaking',
                prompt: `Say in Russian: <strong>${item.ru}</strong> (${item.en})`,
                audio: item.audio,
                correct: item.ru,
                // no check function; handled via similarity
            };
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderExercise(ex) {
            if (!ex) {
                container.innerHTML = '<p>No exercises available. Please choose a topic.</p>';
                checkBtn.disabled = true;
                recordBtn.disabled = true;
                ratingDiv.innerHTML = '';
                return;
            }
            currentExercise = ex;
            userAnswer = null;
            feedbackDiv.classList.remove('show', 'correct', 'incorrect');
            feedbackDiv.innerHTML = '';
            ratingDiv.innerHTML = '';
            checkBtn.disabled = false;
            recordBtn.disabled = true;

            let html = `<div class="prompt">${ex.prompt}</div>`;

            if (ex.type === 'select') {
                html += `<ul class="options">`;
                ex.options.forEach(opt => {
                    html += `<li><button class="option-btn" data-value="${opt}">${opt}</button></li>`;
                });
                html += `</ul>`;
            } else if (ex.type === 'write' || ex.type === 'fillblank') {
                html += `<input type="text" id="text-answer" placeholder="Type here..." style="width:100%; padding:0.5rem; font-size:1rem;">`;
            } else if (ex.type === 'reading' || ex.type === 'speaking') {
                html += `<p>Listen to the audio and then speak.</p>`;
                if (ex.type === 'speaking') {
                    recordBtn.disabled = false;
                }
            }

            container.innerHTML = html;

            if (ex.type === 'select') {
                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        userAnswer = btn.dataset.value;
                    });
                });
            }

            if (ex.type === 'write' || ex.type === 'fillblank') {
                const input = document.getElementById('text-answer');
                input.addEventListener('input', () => {
                    userAnswer = input.value;
                });
            }

            playAudioBtn.onclick = () => {
                if (ex.audio) {
                    const audio = new Audio('audio/' + ex.audio);
                    audio.play();
                }
            };
        }

        function checkAnswer() {
            if (!currentExercise) return;
            let isCorrect = false;
            let message = '';

            if (currentExercise.type === 'select') {
                if (userAnswer === null) {
                    alert('Please select an option');
                    return;
                }
                isCorrect = currentExercise.check(userAnswer);
                document.querySelectorAll('.option-btn').forEach(btn => {
                    if (btn.dataset.value === currentExercise.correct) {
                        btn.classList.add('correct');
                    } else if (btn.dataset.value === userAnswer) {
                        btn.classList.add('incorrect');
                    }
                });
            } else if (currentExercise.type === 'write' || currentExercise.type === 'fillblank') {
                if (!userAnswer || userAnswer.trim() === '') {
                    alert('Please type an answer');
                    return;
                }
                isCorrect = currentExercise.check(userAnswer);
            } else if (currentExercise.type === 'reading') {
                isCorrect = true; // self-evaluation
                message = 'Self-evaluation: read aloud and compare with the audio.';
            } else if (currentExercise.type === 'speaking') {
                return; // handled automatically after speech recognition
            }

            if (isCorrect) {
                score++;
                message = 'Correct!';
                feedbackDiv.className = 'feedback correct show';
            } else {
                message = `Incorrect. The correct answer is: <strong>${currentExercise.correct}</strong>`;
                feedbackDiv.className = 'feedback incorrect show';
            }
            totalAnswered++;
            scoreDisplay.textContent = `Score: ${score} / ${totalAnswered}`;
            feedbackDiv.innerHTML = message;
            checkBtn.disabled = true;
        }

        // Levenshtein distance and similarity for speaking
        function levenshtein(a, b) {
            const matrix = Array.from({ length: a.length + 1 }, () => []);
            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }
            return matrix[a.length][b.length];
        }

        function similarityPercentage(str1, str2) {
            const s1 = str1.trim().toLowerCase();
            const s2 = str2.trim().toLowerCase();
            if (s1.length === 0 || s2.length === 0) return 0;
            const dist = levenshtein(s1, s2);
            const maxLen = Math.max(s1.length, s2.length);
            return Math.max(0, Math.round((1 - dist / maxLen) * 100));
        }

        function getRating(percent) {
            if (percent >= 95) return 'Perfect! 🎯';
            if (percent >= 85) return 'Very good! 👏';
            if (percent >= 70) return 'Good! 👍';
            if (percent >= 50) return 'Okay. 🙂';
            if (percent >= 30) return 'Bad. 😕';
            return 'Terrible. 😖';
        }

        function handleSpeakingResult(transcript) {
            if (!currentExercise || currentExercise.type !== 'speaking') return;

            const percent = similarityPercentage(transcript, currentExercise.correct);
            const rating = getRating(percent);
            const message = `You said: <strong>${transcript}</strong><br>
                             Similarity: <strong>${percent}%</strong><br>
                             Rating: <strong>${rating}</strong>`;

            feedbackDiv.className = 'feedback show';
            feedbackDiv.innerHTML = message;
            ratingDiv.innerHTML = `<span style="font-size:2rem;">${rating}</span>`;

            const isCorrect = percent >= 70;
            if (isCorrect) score++;
            totalAnswered++;
            scoreDisplay.textContent = `Score: ${score} / ${totalAnswered}`;
            checkBtn.disabled = true;
        }

        // Speech recognition setup
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                currentExercise.transcript = transcript;
                const old = document.getElementById('transcript');
                if (old) old.remove();
                const p = document.createElement('p');
                p.id = 'transcript';
                p.innerHTML = `You said: <strong>${transcript}</strong>`;
                container.appendChild(p);

                if (currentExercise.type === 'speaking') {
                    handleSpeakingResult(transcript);
                } else {
                    checkBtn.disabled = false;
                }
            };

            recognition.onerror = (event) => {
                alert('Speech recognition error: ' + event.error);
            };

            recordBtn.addEventListener('click', () => {
                recognition.start();
                recordBtn.disabled = true;
            });

            recognition.onend = () => {
                recordBtn.disabled = false;
            };
        } else {
            recordBtn.style.display = 'none';
        }

        // Topic selection
        topicSelect.addEventListener('change', () => {
            currentTopic = topicSelect.value;
            nextExercise();
        });

        // Initialization
        loadSeen();
        currentTopic = 'all';
        topicSelect.value = 'all';
        nextExercise();

        nextBtn.addEventListener('click', nextExercise);
        checkBtn.addEventListener('click', checkAnswer);
    </script>
